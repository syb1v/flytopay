[project]
name = "flytopay-backend"
version = "0.12.0"
description = "Flytopay application API and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic[email]>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "celery>=5.4,<6",
  "aiogram>=3.15,<4",
  "cryptography>=43,<45",
  "structlog>=24,<26",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "asgi-lifespan>=2,<3",
]
dev = [
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
