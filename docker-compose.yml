services:
  api:
    build: {context: ./apps/backend, dockerfile: Dockerfile}
    env_file: .env
    command: uvicorn flytopay.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: {context: ./apps/backend, dockerfile: Dockerfile}
    env_file: .env
    command: celery -A flytopay.worker.celery_app worker --loglevel=INFO
    depends_on: [postgres, redis]
  scheduler:
    build: {context: ./apps/backend, dockerfile: Dockerfile}
    env_file: .env
    command: celery -A flytopay.worker.celery_app beat --loglevel=INFO
    depends_on: [postgres, redis]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./apps/web:/app"]
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment: {NEXT_PUBLIC_API_ORIGIN: "${NEXT_PUBLIC_API_ORIGIN:-http://localhost:8000}"}
    ports: ["3000:3000"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: flytopay, POSTGRES_USER: flytopay, POSTGRES_PASSWORD: flytopay}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
