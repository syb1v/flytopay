  /products/{code}:
    delete:
      operationId: archiveClientProduct
      tags: [Products]
      summary: Архивировать клиент-продукт
      description: >-
        Удаляет продукт и деактивирует запись: выпуск новых
        карт по нему становится недоступен. Заголовок `Idempotency-Key` обязателен.


        ⚠️ АРХИВИРОВАТЬ МОЖНО ТОЛЬКО ПРОДУКТ БЕЗ ЖИВЫХ КАРТ. Если по продукту есть
        хотя бы одна карта в состоянии active / frozen / suspended — архивация
        ОТКЛОНЯЕТСЯ. Сначала закройте (`DELETE /cards/{cardId}`) все
        карты продукта, затем архивируйте. Отказ приходит как `422
        request.validation_failed` с generic-сообщением `"Could not archive product"`
        — точное число живых карт наружу НЕ передаётся.


        Если продукт не найден, возвращается `404`; синтаксически некорректный `code`
        также даёт `404` (а не `422`). Прочие бизнес-отказы тоже
        сводятся к `422` с тем же generic-сообщением (детализации в `error.fields` нет).
      x-required-scope: cards:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
        - { name: code, in: path, required: true, description: 'Код клиент-продукта (из ответа POST /products). Не совпадающий с ^[a-z0-9][a-z0-9_-]{1,63}$ → 404.', schema: { type: string } }
      responses:
        '200':
          description: Архивирован
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [code, archived]
                        properties:
                          code: { type: string, description: 'Код архивированного продукта' }
                          archived: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}:
    get:
      operationId: getCard
      tags: [Cards]
      summary: Карта
      description: >-
        Поля last4, maskedNumber, expMonth, expYear могут быть null, пока
        status=issuing: они дозаполняются после завершения асинхронного выпуска
        карты. Поле `balance` в ЭТОМ ответе всегда `null` — актуальный баланс
        получайте через `GET /cards/{cardId}/balance` (в списке `GET /cards`
        поле, наоборот, заполняется). Клиент должен игнорировать незнакомые поля
        ответа для обратной совместимости.
      x-required-scope: cards:read
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Карта
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Card'
              example:
                success: true
                status: 200
                message: OK
                data:
                  cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                  cardholderId: 3c1d2e3f-0000-4000-8000-000000000010
                  status: active
                  productCode: null
                  scheme: visa
                  maskedNumber: '···· ···· ···· 4242'
                  last4: '4242'
                  expMonth: 12
                  expYear: 2028
                  currency: USD
                  scale: 2
                  nameOnCard: null
                  planCode: default
                  externalReference: null
                  balance: null
                  issuedAt: '2026-07-01T12:00:04Z'
                  closedAt: null
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCT, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: closeCard
      tags: [Cards]
      summary: Закрытие карты
      description: >-
        Если баланс карты равен 0, закрытие выполняется синхронно (200). Если
        на карте есть остаток, он сначала выводится на кошелёк отдельным
        unload-ордером (комиссия за вывод с остатка при закрытии не взимается),
        после чего карта закрывается; ответ — 202 Accepted, окончательный
        результат приходит событиями card.closed и card.unloaded, а также
        доступен через GET /orders/{orderId}. Отдельного типа ордера close нет.
        Если карта создана недавно (не истёк период закрытия), возвращается
        422 card.too_new_to_close. Повторный запрос на уже закрытую карту с тем
        же Idempotency-Key возвращает исходный результат (200).
      x-required-scope: cards:write
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: false
        description: Тело не требуется. Поле `reason` принимается, но в текущем релизе ИГНОРИРУЕТСЯ — код его не читает.
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
                  description: В текущем релизе игнорируется (нигде не сохраняется и не возвращается).
            example: {}
      responses:
        '200':
          description: Закрыта синхронно (баланс был 0)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CardCloseResult'
              example:
                success: true
                status: 200
                message: OK
                data:
                  cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                  status: closed
                  closedAt: '2026-07-01T13:00:00Z'
                  residualMinor: 0
                  currency: USD
                  scale: 2
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCV, timestamp: '2026-07-01T13:00:00Z' }
        '202':
          description: >-
            Остаток выводится unload-ордером, после чего карта закрывается
            (CardCloseAccepted); либо по карте уже выполняется вывод остатка
            (LifecyclePending) — в этом случае повторите запрос DELETE с тем же
            Idempotency-Key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/CardCloseAccepted'
                          - $ref: '#/components/schemas/LifecyclePending'
              example:
                success: true
                status: 202
                message: Accepted
                data:
                  cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                  status: closing
                  orderId: 7a2b3c4d-0000-4000-8000-000000000005
                  type: unload
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCW, timestamp: '2026-07-01T13:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/LifecycleCooldown' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

