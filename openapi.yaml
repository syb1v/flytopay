  /cards/{cardId}/fund:
    post:
      operationId: fundCard
      tags: [Cards]
      summary: Пополнение карты (асинхронно, 202)
      description: >-
        amountMinor — сумма нетто, зачисляемая на карту. С кошелька списывается
        amountMinor + feeMinor (рассчитать заранее можно через
        GET /tariffs/quote?operation=fund&cardId=…). Суммы указываются в целых
        minor-единицах валюты карты (USD, scale 2). Операция асинхронная: ответ
        202 Accepted с orderId, окончательный результат смотрите в
        GET /orders/{orderId} и в вебхуках. Успешное пополнение снимает статус
        suspended только при включённой возможности suspendedClearedByFund.
        Если операция не удалась после 202, ордер переходит в статус refunded с
        полем failureCode и отправляется событие card.funding_failed; списание
        с кошелька при этом компенсируется автоматически.
      x-required-scope: cards:write
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundRequest'
            example: { amountMinor: 10000, currency: USD, externalReference: fund-001 }
      responses:
        '202':
          description: Принято в исполнение
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderAccepted'
              example:
                success: true
                status: 202
                message: Accepted
                data: { orderId: 9f3c1a2b-0000-4000-8000-000000000006, type: fund, status: processing }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCY, timestamp: '2026-07-01T12:00:00Z' }
        '200':
          description: >-
            Идемпотентный реплей уже терминального ордера — полный объект ордера
            (status=completed | failed | refunded; при failed/refunded заполнен
            failureCode). Проверяйте data.status — 200 сам по себе не означает успех.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}/unload:
    post:
      operationId: unloadCard
      tags: [Cards]
      summary: Вывод средств с карты (асинхронно, 202)
      description: >-
        Комиссия удерживается из выводимой суммы: с карты списывается amountMinor
        (брутто), наша комиссия вычитается из фактически снятого, кошелёк ничего
        не резервирует заранее. На кошелёк зачисляется creditedMinor = фактически
        снятое минус feeMinor. При частичном исполнении комиссия пропорциональна
        фактически снятой сумме и не превышает зачисляемое; округление — в пользу
        клиента. Суммы указываются в целых minor-единицах валюты карты (USD,
        scale 2). Итоговые значения unloadedMinor, feeMinor и creditedMinor
        содержатся в терминальном ордере и в событии card.unloaded. Если операция
        не удалась после 202, ордер переходит в статус failed и отправляется
        событие card.unloading_failed; баланс карты при этом не меняется.
      x-required-scope: cards:write
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnloadRequest'
            example: { amountMinor: 5000, currency: USD, externalReference: unl-001 }
      responses:
        '202':
          description: Принято в исполнение
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderAccepted'
              example:
                success: true
                status: 202
                message: Accepted
                data: { orderId: 7a2b3c4d-0000-4000-8000-000000000005, type: unload, status: processing }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCZ, timestamp: '2026-07-01T12:00:00Z' }
        '200':
          description: >-
            Идемпотентный реплей уже терминального ордера — полный объект ордера
            (status=completed | failed | refunded; при failed/refunded заполнен
            failureCode). Проверяйте data.status — 200 сам по себе не означает успех.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}/freeze:
    post:
      operationId: freezeCard
      tags: [Cards]
      summary: Заморозка карты (синхронно)
      description: >-
        Операция идемпотентна по своей природе: повторная заморозка уже
        замороженной карты — это no-op с ответом 200, поэтому Idempotency-Key
        необязателен. Пока карта заморожена, авторизации отклоняются, а
        пополнение (fund) возвращает 409 card.frozen. При таймауте запрос можно
        безопасно повторить или свериться с GET /cards/{cardId}. Слишком частые
        lifecycle-операции по одной карте возвращают 429 card.lifecycle_cooldown
        с заголовком Retry-After (кулдаун около 10 секунд).
      x-required-scope: cards:write
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        description: >-
          Тело не требуется. Поле `reason` принимается, но в текущем релизе ИГНОРИРУЕТСЯ — код его не
          читает: в событии card.frozen всегда приходит reason=client_request.
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
                  description: В текущем релизе игнорируется (в событии card.frozen всегда reason=client_request).
            example: {}
      responses:
        '200':
          description: Заморожена
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CardLifecycleResult'
              example:
                success: true
                status: 200
                message: OK
                data: { cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5, status: frozen, frozenAt: '2026-07-01T12:40:00Z' }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABD0, timestamp: '2026-07-01T12:40:00Z' }
        '202':
          description: >-
            Операция не подтвердилась синхронно (таймаут). Окончательный
            статус придёт событием card.frozen или будет доступен через
            GET /cards/{cardId}.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LifecyclePending'
              example:
                success: true
                status: 202
                message: Accepted
                data: { status: pending, message: 'Freeze accepted; terminal state will arrive via card.frozen webhook or GET /cards/{cardId}' }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABD0, timestamp: '2026-07-01T12:40:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/LifecycleCooldown' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}/unfreeze:
    post:
      operationId: unfreezeCard
      tags: [Cards]
      summary: Разморозка карты (синхронно)
