                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABD1, timestamp: '2026-07-01T12:45:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/LifecycleCooldown' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}/reveal-token:
    post:
      operationId: createCardRevealToken
      tags: [Cards]
      summary: Reveal-токен (токенизация) — НЕ РЕАЛИЗОВАНО (всегда 422 not_supported)
      description: >-
        **Метод не реализован.** Endpoint объявлен в контракте, но на ЛЮБОЙ запрос
        возвращает `422 not_supported`: токенизация не поддерживается
        (`features.tokenization=false`, `features.secureReveal=false`). Никакой
        reveal-сессии, TTL и `iframeUrl` не существует — путь даже не резолвится в
        карту, поэтому 404/409 на чужую или неактивную карту НЕ возвращаются.


        Прямой путь получения реквизитов — `POST /cards/{cardId}/secure`
        (режим D2, требует `features.secureApiRaw`).


        Планируемое (пока НЕ реализованное) поведение — одноразовая сессия
        (TTL 90 с) и `iframeUrl` защищённого origin, через который PAN/CVV
        показываются пользователю, минуя ваш бэкенд.
      deprecated: true
      x-required-scope: cards:secure:read
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        # Не реализовано (StubController@notImplemented): единственный доменный исход — 422 not_supported.
        # Прочие коды — от middleware (auth/scope/rate-limit) или инфраструктуры.
        '422': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cards/{cardId}/secure:
    post:
      operationId: revealCardSecure
      tags: [Cards]
      summary: Получение PAN/CVV карты в JSON (по договорённости, синхронно)
      description: >-
        Доступно только при включённой возможности secureApiRaw. Включение не
        self-serve: предоставляется по договорённости при действующей PCI-
        аттестации вашей стороны, с IP-allowlist и mTLS, и определяет ваш
        SAQ-уровень (SAQ-D). Доступно только для карт со status=active, иначе
        возвращается 409 card.not_revealable. Реквизиты передаются transient-only:
        не сохраняются и не логируются ни на одном участке; фиксируется только
        факт доступа. Клиент не должен логировать или сохранять ответ.
        Idempotency-Key не используется (операция чтения).


        Запросы к защищённым методам расходуют общую write-корзину аккаунта
        (20 запросов/мин); при превышении — 429 rate_limit.exceeded с
        details.retryAfter. Выделенная secure-корзина (per-card/per-account/
        circuit-breaker) и details.scope=secure — в планах, в текущем релизе НЕ
        применяются.


        ВНИМАНИЕ: ответ НЕ содержит заголовка `Cache-Control: no-store` — не
        полагайтесь на него. Обеспечьте на своей стороне, чтобы ответ не
        кэшировался, не логировался и не сохранялся.
      x-required-scope: cards:secure:read
      parameters:
