                            items:
                              $ref: '#/components/schemas/WebhookDelivery'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
              example:
                success: true
                status: 200
                message: OK
                data:
                  items:
                    - deliveryId: c1d2e3f4-0000-4000-8000-000000000009
                      event: card.funded
                      status: delivered
                      attempts: 1
                      lastHttpCode: 200
                      lastError: null
                      nextRetryAt: null
                      deliveredAt: '2026-07-01T12:00:05Z'
                      createdAt: '2026-07-01T12:00:04Z'
                  pagination: { limit: 20, nextCursor: null, hasMore: false }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABD8, timestamp: '2026-07-01T12:34:56Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

# =============================================================================
# Исходящие вебхуки (контракт приёма на стороне клиента).
# Доставка гарантирует «не менее одного раза» — выполняйте дедупликацию по
# eventId. Порядок между событиями НЕ гарантирован — стройте state-машину по
# полю occurredAt и статусам.
# Подпись (режим caas_v1). В заголовке X-Caas-Signature приходит строка вида:
#     X-Caas-Signature: t=1719830400,v1=3ba9f1e0c8b7...
# где t — Unix-время отправки (в секундах), v1 — hex-подпись HMAC-SHA256.
# Как собрать и проверить подпись (ровно в этом порядке):
#   1) Возьмите СЫРОЕ тело запроса как есть, до любого парсинга (rawBody, байты).
#   2) Разберите заголовок на t и v1 (пары «ключ=значение» через запятую).
#   3) Выведите ключ подписи из вашего webhook-секрета:
#        signingKey = hex(SHA256(webhookSecret))    // 64-символьная hex-СТРОКА в нижнем регистре, НЕ сырые байты
#   4) Составьте подписываемое сообщение (метка времени, точка, тело):
#        signedPayload = t + "." + rawBody           // напр. "1719830400." + тело
#   5) Посчитайте ожидаемую подпись:
#        expected = hex(HMAC_SHA256(key = signingKey, message = signedPayload))
#   6) Сравните expected с v1 в constant-time (напр. hmac.compare_digest). Не совпало → отклоните.
#   7) Проверьте свежесть метки: |текущее_время − t| ≤ 300 секунд, иначе отклоните (защита от replay).
# Затем выполните дедупликацию по eventId, обработайте событие и ответьте кодом 2xx
# в течение 8 секунд.
# Повторные попытки: сразу, затем +30s, +2m, +10m, +1h, +3h, +6h (7 попыток,
# около 22 часов, с джиттером); коды 408/429/5xx и таймаут вызывают повтор,
# прочие 4xx считаются терминальным отказом (failed).
# Денежные события эмитятся ПОСЛЕ финализации средств, поэтому суммам в них
# можно доверять.
# =============================================================================

webhooks:

  card.created:
    post:
      operationId: onCardCreated
      summary: Карта выпущена и активна (ордер issue завершён)
      description: 'Отправляется после успешного выпуска активной карты (завершения ордера issue). Поля last4/expMonth/expYear/scheme могут быть null при отложенном провижининге — дочитайте актуальные данные через GET /cards/{cardId}.'
