# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ck_{keyid}_{secret}
      description: >-
        API-ключ передаётся в заголовке: `Authorization: Bearer ck_{keyid}_{secret}`
        (три сегмента через underscore: префикс `ck`, keyid из 12 hex-символов и секрет).
        Секрет показывается один раз при выдаче ключа — храните его как пароль.
        Каждый ключ несёт фиксированный набор scopes (требуемый scope указан в описании
        операции); запрос вне scope возвращает 403 auth.scope_denied. Невалидный или
        отозванный ключ, а также приостановленный (suspended) аккаунт возвращают
        401 auth.unauthorized на всех endpoint'ах, КРОМЕ GET /account/info
        (там виден status=suspended).
        Доступные scopes: account:read, account:write, cardholders:read, cardholders:write,
        cards:read, cards:write, cards:secure:read (по умолчанию НЕ выдаётся),
        transactions:read, tariffs:read, webhooks:read, webhooks:write.

  parameters:

    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Ключ идемпотентности (обязателен для этой операции). Область уникальности —
        пара (аккаунт, метод + итоговый путь с подставленным {id}); ключи уникальны
        бессрочно, не переиспользуйте их — генерируйте новый UUID на каждую новую операцию.
        При повторе с тем же ключом и телом: если операция уже завершена — возвращается
        сохранённый ответ (replay); если ещё выполняется — 409 idempotency.in_progress;
        если тело запроса отличается — 409 idempotency.key_conflict.
        Совпадение тела определяется по SHA-256 от метода, итогового пути, идентификатора
        аккаунта, окружения и канонизированного JSON тела (RFC 8785 / JCS); пустое или
        отсутствующее тело канонизируется как {}.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:-]{16,128}$'
      example: 6f1d2c3b-4a5e-4f60-8b7c-9d0e1f2a3b4c

    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Операция идемпотентна по своей природе; ключ можно не передавать.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:-]{16,128}$'

    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Размер страницы. Валидация лояльная — ошибка НЕ возвращается: значения вне диапазона
        молча приводятся к границе (>100 → 100, <1 → 1). Нечисловое значение трактуется
        по-разному: в GET /cards и GET /cardholders — как значение по умолчанию (20), в
        GET /account/transactions и GET /webhooks/deliveries — как 1. Фактический размер
        страницы всегда возвращается в data.pagination.limit.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачная строка из поля pagination.nextCursor предыдущей страницы; не конструируйте и не изменяйте её. Невалидный курсор → 400 request.malformed.
      schema: { type: string, maxLength: 512 }

    CardId:
      name: cardId
      in: path
      required: true
      description: Идентификатор карты; чужой или несуществующий → 404 card.not_found.
      schema: { type: string, maxLength: 64 }

    CardholderId:
      name: cardholderId
      in: path
      required: true
      description: Идентификатор держателя карты; чужой или несуществующий → 404 cardholder.not_found.
      schema: { type: string, maxLength: 64 }

    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор ордера; чужой или несуществующий → 404 order.not_found.
      schema: { type: string, maxLength: 64 }

    WhSignature:
      name: X-Caas-Signature
      in: header
      required: true
      description: >-
        Подпись вебхука: `t=<unix>,v1=<hex>`. Здесь t — Unix-время отправки (секунды),
        v1 — hex-подпись HMAC-SHA256. Ключ подписи = hex(SHA-256(ваш webhook-секрет))
        (64-символьная hex-строка), подписываемое сообщение = `t + "." + сырое тело запроса`.
        Проверка: посчитайте HMAC-SHA256 от `t + "." + rawBody` этим ключом, сравните с v1
        в constant-time и убедитесь, что t не старше 5 минут. Полная пошаговая формула — в
        комментарии в начале раздела webhooks.
      schema: { type: string }

    WhEvent:
      name: X-Caas-Event
      in: header
      required: true
      description: Тип события (совпадает с полем event в теле запроса).
      schema: { type: string }

    WhEventId:
      name: X-Caas-Event-Id
      in: header
      required: true
      description: Идентификатор события (совпадает с полем eventId в теле); используйте как ключ дедупликации.
      schema: { type: string }

    WhDelivery:
      name: X-Caas-Delivery
      in: header
      required: true
      description: Номер попытки доставки (от 1 до 7).
      schema: { type: integer, minimum: 1 }

    WhTest:
      name: X-Caas-Test
      in: header
      required: false
      description: >-
        Присутствует со значением 1 только у тест-доставок (POST /webhooks/test). Дублирует
        data.test=true; гейтите бизнес-обработку по любому из них. У тест-доставок eventId
        имеет префикс `test-` (не UUID) — не проводите по ним деньги/статусы.
      schema: { type: string, enum: ['1'] }

  headers:
    RetryAfter:
      description: Число секунд до следующей допустимой попытки.
      schema: { type: integer }
    RateLimitLimit:
      description: Лимит запросов в текущем окне rate-limit.
      schema: { type: integer }
    RateLimitRemaining:
      description: Остаток запросов в текущем окне rate-limit.
      schema: { type: integer }
    RateLimitReset:
      description: Unix-время, когда окно rate-limit будет сброшено.
      schema: { type: integer }

  responses:

    BadRequest:
      description: 'Ошибка запроса: request.malformed | request.idempotency_key_required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 400
            message: Idempotency-Key header is required for this operation
            error: { code: request.idempotency_key_required }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE0, timestamp: '2026-07-01T12:34:56Z' }

    Unauthorized:
      description: 'auth.unauthorized: ключ невалиден или отозван, либо аккаунт приостановлен (suspended) — кроме GET /account/info, где приостановленный аккаунт получает 200 с status=suspended (см. описание операции).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 401
            message: Invalid or revoked API key
            error: { code: auth.unauthorized }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE1, timestamp: '2026-07-01T12:34:56Z' }

    Forbidden:
      description: '403: auth.scope_denied (у ключа нет требуемого scope; error.details.requiredScope) | auth.ip_not_allowed (IP запроса не входит в IP-allowlist аккаунта).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 403
            message: API key does not have the required scope
            error: { code: auth.scope_denied, details: { requiredScope: 'cards:write' } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE2, timestamp: '2026-07-01T12:34:56Z' }

    NotSupported:
      description: 'not_supported (422): операция объявлена в контракте API, но недоступна в текущем релизе (или намеренно не поддерживается для данной модели аккаунта).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 422
            message: This endpoint is declared in the API contract but is not available in the current release
            error: { code: not_supported }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE3, timestamp: '2026-07-01T12:34:56Z' }

    SecureDisabled:
      description: 'secure.disabled: показ защищённых данных карты не включён для аккаунта (features.secureReveal=false), либо auth.scope_denied.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 403
            message: Secure reveal is not enabled for this account
            error: { code: secure.disabled }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE3, timestamp: '2026-07-01T12:34:56Z' }

    NotFound:
      description: 'Ресурс не существует или принадлежит другому аккаунту/окружению (единый ответ 404 обеспечивает изоляцию аккаунтов): card.not_found | cardholder.not_found | order.not_found | product.not_found | webhook.not_configured.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 404
            message: Card not found
            error: { code: card.not_found }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE4, timestamp: '2026-07-01T12:34:56Z' }

    Conflict:
      description: 'Конфликт состояния: card.invalid_state | card.frozen | card.not_revealable | cardholder.has_active_cards | operation.pending_reconciliation (дождитесь завершения через поллинг, НЕ выполняйте компенсацию) | operation.duplicate_reference | idempotency.* (при idempotency.in_progress присутствует заголовок Retry-After).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 409
            message: Card is frozen
            error: { code: card.frozen, details: { cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5 } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE5, timestamp: '2026-07-01T12:34:56Z' }

    IdempotencyConflict:
      description: 'idempotency.in_progress (повторите с ТЕМ ЖЕ ключом после Retry-After) | idempotency.key_conflict (терминально — используйте новый ключ).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 409
            message: An operation with this idempotency key is already in progress
            error: { code: idempotency.in_progress, details: { retryAfter: 2 } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE6, timestamp: '2026-07-01T12:34:56Z' }

    ValidationFailed:
      description: '422: request.validation_failed (подробности в error.fields) | funding.below_minimum | amount.exceeds_maximum | wallet.insufficient_balance | card.insufficient_balance | cardholder.not_eligible | card.product_unknown | card.product_not_issuable | card.too_new_to_close | pricing.* | not_supported | provider.declined | webhook.url_not_allowed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 422
            message: Amount is below the minimum for this operation
            error:
              code: funding.below_minimum
              details: { minMinor: 500, currency: USD }
              fields: { amountMinor: ['must be at least 500'] }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE7, timestamp: '2026-07-01T12:34:56Z' }

    PricingPlanMissing:
      description: '422 pricing.plan_missing: тарифный план не найден, неактивен или приватен (ошибка конфигурации — обратитесь в поддержку) | pricing.rate_missing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 422
            message: No active tariff plan resolved for this account
            error: { code: pricing.plan_missing }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE8, timestamp: '2026-07-01T12:34:56Z' }

    RateLimited:
      description: 'rate_limit.exceeded (повторяйте с задержкой не меньше Retry-After плюс jitter, с тем же ключом) | quota.exceeded (превышена продуктовая квота).'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 429
            message: Rate limit exceeded
            error: { code: rate_limit.exceeded, details: { retryAfter: 30 } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABE9, timestamp: '2026-07-01T12:34:56Z' }

    LifecycleCooldown:
      description: 'card.lifecycle_cooldown (слишком частые операции freeze/unfreeze/close по одной карте; пауза около 10 секунд) | rate_limit.exceeded.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 429
            message: Too many lifecycle operations for this card, retry later
            error: { code: card.lifecycle_cooldown, details: { retryAfter: 10 } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABEA, timestamp: '2026-07-01T12:34:56Z' }

    InternalError:
      description: 'internal.error — ошибка на нашей стороне; можно повторить с экспоненциальной задержкой.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 500
            message: Internal error
            error: { code: internal.error }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABEB, timestamp: '2026-07-01T12:34:56Z' }

    ServiceUnavailable:
      description: 'service.unavailable — внутренний сервис временно недоступен; можно повторить с тем же ключом. Для денежных write-операций вместо 503 обычно возвращается 202 Accepted.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            status: 503
            message: Service temporarily unavailable
            error: { code: service.unavailable, details: { retryAfter: 5 } }
            meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABEC, timestamp: '2026-07-01T12:34:56Z' }

  schemas:

    # ------------------------------------------------------------------ базис

    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          description: Присваивается сервером. Указывайте его при обращении в поддержку
        timestamp:
          type: string
          format: date-time
          description: Время в формате RFC 3339 (UTC)

    SuccessEnvelope:
      type: object
      description: Единый конверт успешного ответа. Содержимое data зависит от операции
      required: [success, status, message, data, meta]
      properties:
        success:
          const: true
        status:
          type: integer
          description: HTTP-код ответа, продублированный в теле
        message:
          type: string
          description: Текст для человека. Не используйте его для ветвления логики
        data:
          description: Ресурс ответа. Для коллекций — объект { items, pagination }
        meta:
          $ref: '#/components/schemas/Meta'

    Error:
      type: object
      description: Тело поля error при success=false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          type: object
          description: Дополнительные нечувствительные поля контекста (например, id, суммы в minor-единицах с currency, retryAfter)
          additionalProperties: true
        fields:
          type: object
          description: 'Ошибки валидации по полям: { "field": ["сообщение", …] }'
          additionalProperties:
            type: array
            items: { type: string }

    ErrorEnvelope:
      type: object
      description: Единый конверт ответа с ошибкой
      required: [success, status, message, error, meta]
      properties:
        success:
          const: false
        status:
          type: integer
        message:
          type: string
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorCode:
      type: string
      description: >-
        Стабильный машинный код ошибки — единственное, по чему клиенту следует
        ветвить логику (текст message предназначен только для человека). Набор
        кодов ОТКРЫТЫЙ: в рамках уже существующих HTTP-статусов могут появляться
        новые коды, это не считается ломающим изменением. Клиент, сгенерированный
        из спецификации, не должен трактовать это поле как строгий enum —
        обязательно предусмотрите ветку по умолчанию для незнакомых значений.
        Текущие значения: request.malformed, request.validation_failed,
        request.idempotency_key_required, auth.unauthorized, auth.scope_denied,
        auth.ip_not_allowed,
        secure.disabled, card.not_found, cardholder.not_found, order.not_found,
        webhook.not_configured, idempotency.in_progress, idempotency.key_conflict,
        card.invalid_state, card.frozen, card.not_revealable,
        cardholder.has_active_cards, operation.pending_reconciliation,
        operation.duplicate_reference, funding.below_minimum, amount.exceeds_maximum,
        card.insufficient_balance, wallet.insufficient_balance, card.product_unknown,
        card.product_not_issuable, cardholder.not_eligible, card.too_new_to_close,
        pricing.plan_missing, pricing.rate_missing, kyc.not_supported, not_supported,
        webhook.url_not_allowed, provider.declined, rate_limit.exceeded,
        quota.exceeded, card.lifecycle_cooldown, internal.error, service.unavailable,
        product.not_found.

    FailureCode:
      type: string
      description: >-
        Закрытый словарь причин отказа: значение order.failureCode и поля
        failureCode в событиях *_failed. Не путать с error.code=provider.declined
        синхронного (422) пути.
      enum:
        - card_state_invalid
        - insufficient_card_balance
        - wallet_insufficient_balance
        - provider_rejected
        - temporarily_unavailable
        - internal_timeout
        - limit_exceeded
        - internal_error

    Money:
      type: object
      description: >-
        Канонический денежный триплет. Все суммы в контракте — целые числа в
        минимальных (minor) единицах; интерпретируются по паре currency + scale.
        Единицы у кошелька и карт РАЗНЫЕ (кошелёк — USDT/6, карты — USD/2),
        поэтому складывать суммы без приведения scale нельзя.
      required: [amountMinor, currency, scale]
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Сумма в минимальных единицах (может быть отрицательной только там, где это явно оговорено)
        currency:
          type: string
          description: ISO-код или тикер (USD, USDT)
        scale:
          type: integer
          description: Число знаков minor-единицы (USD=2, USDT=6)

    Pagination:
      type: object
      description: 'Наличие объекта pagination зависит от эндпоинта: он возвращается только у списков с курсорной пагинацией (GET /cards, GET /cardholders, GET /account/transactions). Списки с фиксированным лимитом на стороне сервера (GET /cards/products, GET /products, GET /cards/{cardId}/transactions) объект pagination не возвращают.'
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer }
        nextCursor:
          type: [string, 'null']
          maxLength: 512
        hasMore: { type: boolean }

    # ------------------------------------------------------------------ enum'ы

    CardStatus:
      type: string
      description: 'Терминальные статусы: closed, expired. Статуса failed нет — неудачный выпуск не создаёт карту (событие card.failed приходит без cardId). Статус suspended снимается успешным пополнением (fund) при features.suspendedClearedByFund=true, а не разморозкой (unfreeze).'
      enum: [issuing, active, frozen, suspended, closed, expired]

    OrderStatus:
      type: string
      description: 'processing — операция ещё выполняется (при поллинге GET /orders/{orderId} отвечает HTTP 202); completed, failed, refunded — терминальные (failed — списания не было; refunded — списание скомпенсировано)'
      enum: [processing, completed, failed, refunded]

    OrderType:
      type: string
      description: Типа close нет — закрытие карты с ненулевым остатком создаёт ордер типа unload
      enum: [issue, fund, unload]

    CardholderStatus:
      type: string
      enum: [active, inactive, suspended]

    KycStatus:
      type: string
      description: waived — нормальное рабочее состояние (эквивалент accepted для целей выпуска карт)
      enum: [unsubmitted, submitted, accepted, rejected, waived]

    CardTransactionType:
      type: string
      enum: [authorization, settlement, fee, refund, reversal]

    CardTransactionStatus:
      type: string
      enum: [pending, completed, declined, refunded, reversed]

    WalletTransactionType:
      type: string
      description: 'deposit — пополнение кошелька; card_funding — списание под выпуск или пополнение карты; card_fee — наша комиссия; card_unload — зачисление с карты; refund — компенсация неудавшегося ордера; program_return — возврат средств из кошелька в основной баланс; adjustment — служебная корректировка (не фильтруется, показывается при наличии)'
      enum: [deposit, card_funding, card_fee, card_unload, refund, program_return, adjustment]

    DeliveryStatus:
      type: string
      enum: [pending, retrying, delivered, failed, dead, skipped]

    FeeItem:
      type: string
      description: Статья тарифа (написание tokenization совпадает с features.tokenization)
      enum: [issuance, funding, unload, transaction, fx, maintenance, decline, chargeback, tokenization]

    DeclineCode:
      type: string
      description: Закрытый набор причин отказа по операции (деклайна); значение по умолчанию — other
      enum: [insufficient_funds, card_inactive, card_frozen, card_suspended, invalid_credentials, three_ds_failed, merchant_not_allowed, limit_exceeded, suspected_fraud, other]

    FeeType:
      type: string
      description: Закрытый набор типов комиссии по карте; значение по умолчанию — other
      enum: [cross_border, decline_domestic, decline_international, maintenance, other]

    # ------------------------------------------------------------------ account

    AccountInfo:
      type: object
      required: [accountId, environment, status, capabilities, webhooksConfigured, createdAt]
      properties:
        accountId: { type: string }
        environment:
          type: string
          enum: [live, test]
          description: >-
            В текущем релизе ВСЕГДА `live`: продукт работает в едином боевом окружении,
            отдельных тестовых ключей/песочницы нет. Значение `test` зарезервировано и
            сейчас не возвращается.
        status:
          type: string
          enum: [active, suspended]
        capabilities:
          type: object
          required: [cardCurrencies, walletCurrencies, walletNetworks, cardSchemes, limits, features, restrictions]
          properties:
            cardCurrencies:
              type: array
              items: { type: string }
            walletCurrencies:
              type: array
              items: { type: string }
            walletNetworks:
              type: object
              description: 'Допустимые сети депозита для каждой валюты кошелька: { "USDT": ["TRON", …] }. Это возможность аккаунта, а не константа'
              additionalProperties:
                type: array
                items: { type: string }
            cardSchemes:
              type: array
              items: { type: string }
              description: Открытый набор (visa, mastercard, …) — предусмотрите ветку по умолчанию для незнакомых значений
            limits:
              type: object
              required: [minIssueAmountMinor, minFundMinor, minUnloadMinor, maxOperationMinor, maxFundMinor, maxCardsPerCardholder, maxCardsPerAccount, dailyFundingVolumeMinor, rateLimits]
              properties:
                minIssueAmountMinor:
                  type: integer
                  format: int64
                  description: Мин. сумма первичного фондирования при выпуске (minor). Значение может меняться — читайте из /account/info, не хардкодьте.
                minFundMinor:
                  type: integer
                  format: int64
                  description: Мин. сумма пополнения карты (minor). Значение может меняться — читайте из /account/info, не хардкодьте.
                minUnloadMinor:
                  type: integer
                  format: int64
                  description: Мин. сумма вывода с карты (minor). Значение может меняться — читайте из /account/info, не хардкодьте.
                maxOperationMinor:
                  type: integer
                  format: int64
                  description: >-
                    Санитарный потолок одной операции (minor). Применяется к ВЫВОДУ с карты
                    (POST /cards/{cardId}/unload). Для ПОПОЛНЕНИЯ действует более жёсткий maxFundMinor —
                    см. ниже. Динамический, читайте из /account/info.
                maxFundMinor:
                  type: integer
                  format: int64
                  description: >-
                    Потолок одного ПОПОЛНЕНИЯ (minor): начальная сумма при выпуске (POST /cards,
                    initialAmountMinor) и пополнение (POST /cards/{cardId}/fund, amountMinor). Превышение →
                    422 amount.exceeds_maximum ДО создания ордера (деньги не двигаются). Жёстче
                    maxOperationMinor; к выводу НЕ применяется. Лимит на ОДНУ операцию, а не потолок баланса
                    карты: несколькими пополнениями можно накопить больше. Динамический — читайте из
                    /account/info, не хардкодьте.
                maxCardsPerCardholder: { type: integer }
                maxCardsPerAccount:
                  type: [integer, 'null']
                  description: null — лимит не установлен
                dailyFundingVolumeMinor:
                  type: [integer, 'null']
                rateLimits:
                  type: object
                  required: [readPerMin, writePerMin, securePerMin]
                  properties:
                    readPerMin: { type: integer }
                    writePerMin: { type: integer }
                    securePerMin: { type: integer }
            features:
              type: object
              required: [secureReveal, secureApiRaw, threeDsOtpRelay, tokenization, kycRequired, suspendedClearedByFund, closeCooldownHours, physicalCards]
              properties:
                secureReveal:
                  type: boolean
                  description: Режим D1 — раскрытие реквизитов через одноразовый токен и hosted-iframe
                secureApiRaw:
                  type: boolean
                  description: Режим D2 — получение реквизитов сырым JSON через POST /cards/{cardId}/secure. По умолчанию false и не подключается самостоятельно (требуются аттестация, IP-allowlist и mTLS)
                threeDsOtpRelay:
                  type: string
                  enum: [email, webhook, none]
                tokenization: { type: boolean }
                kycRequired:
                  type: boolean
                  description: При false держатели получают kycStatus=waived
                suspendedClearedByFund: { type: boolean }
                closeCooldownHours: { type: integer }
                physicalCards: { type: boolean }
            restrictions:
              type: object
              required: [blockedMcc, blockedCountries]
              properties:
                blockedMcc:
                  type: array
                  items: { type: string }
                blockedCountries:
                  type: array
                  items: { type: string, description: 'Код страны в формате ISO-3166-1 alpha-2' }
        webhooksConfigured: { type: boolean }
        createdAt: { type: string, format: date-time }

    WalletBalance:
      type: object
      required: [currency, scale, availableMinor, reservedMinor, totalMinor, onCardsMinor, onCardsCurrency, onCardsScale, availableUsd]
      properties:
        currency: { type: string }
        scale: { type: integer }
        availableMinor:
          type: integer
          format: int64
        reservedMinor:
          type: integer
          format: int64
          description: Зарезервировано под незавершённые (in-flight) ордера — краткий hold на стороне платформы, не связанный с авторизациями по картам
        totalMinor:
          type: integer
          format: int64
          description: available + reserved
        onCardsMinor:
          type: [integer, 'null']
          format: int64
          description: Суммарный баланс карт в валюте карт (onCardsCurrency/onCardsScale); null — срез временно недоступен
        onCardsCurrency: { type: string }
        onCardsScale: { type: integer }
        availableUsd:
          type: string
          description: Информативная оценка в USD (единственная строка с десятичной дробью в контракте). Не используйте её для расчётов — авторитетны availableMinor + scale

    WalletTransaction:
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          required: [id, type, direction, balanceAfterMinor, orderId, cardId, occurredAt]
          properties:
            id: { type: string, description: 'Непрозрачный идентификатор вида wtx_ + 24 hex-символа (не UUID). Отличается от UUID-полей orderId и cardId той же записи.' }
            type:
              $ref: '#/components/schemas/WalletTransactionType'
            direction:
              type: string
              enum: [in, out]
            balanceAfterMinor:
              type: integer
              format: int64
            orderId:
              type: [string, 'null']
            cardId:
              type: [string, 'null']
            occurredAt: { type: string, format: date-time }

    # ------------------------------------------------------------------ tariffs

    TariffPlan:
      type: object
      description: Элемент каталога публичных тарифных планов (ставки не содержит)
      required: [code, name, version, isDefault]
      properties:
        code:
          type: string
          description: Стабильный код плана из каталога тарифов (используется в GET /cards/{cardId}/tariff и /tariffs/quote)
        name: { type: string }
        version:
          type: integer
          description: Актуальная версия плана (информационно; операции всегда исполняются по действующей версии)
        isDefault: { type: boolean }

    FeeRate:
      type: object
      required: [feeItem, collection, chargedFrom, flatMinor, bps, minMinor, period]
      properties:
        feeItem:
          $ref: '#/components/schemas/FeeItem'
        collection:
          type: string
          enum: [upfront, usage]
          description: upfront — списывается с кошелька в момент операции; usage — списывается с баланса карты при событии использования
        chargedFrom:
          type: string
          enum: [wallet, card]
        flatMinor:
          type: integer
          format: int64
          minimum: 0
        bps:
          type: integer
          minimum: 0
          description: Базисные пункты (1 bps = 0.01%)
        minMinor:
          type: integer
          format: int64
          minimum: 0
        period:
          type: string
          enum: [none, monthly]
          description: monthly — применяется только к статье maintenance

    PricingSchedule:
      type: object
      description: >-
        Разрешённая тарифная сетка. Комиссия статьи считается по формуле
        fee = max(minMinor, flatMinor + round(amount × bps / 10000)) с округлением
        half-up в целочисленной арифметике. Публикуются только реально взимаемые
        статьи: если статьи нет в ответе — она не взимается. Версия плана в сетке
        не возвращается (только в quote и в ордере).
      required: [planCode, currency, scale, fees]
      properties:
        planCode:
          type: [string, 'null']
          description: null — план не назначен (обратитесь к нам)
        currency: { type: string }
        scale: { type: integer }
        fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeRate'

    TariffQuote:
      type: object
      required: [operation, currency, scale, amountMinor, feeMinor, totalChargeMinor, planCode, planVersion]
      properties:
        operation:
          type: string
          enum: [issue, fund, unload]
        currency: { type: string }
        scale: { type: integer }
        amountMinor:
          type: integer
          format: int64
          description: Сумма операции нетто — столько получит или отдаст карта
        feeMinor:
          type: integer
          format: int64
          description: Наша комиссия
        totalChargeMinor:
          type: integer
          format: int64
          description: amountMinor + feeMinor — столько спишется с кошелька (для unload комиссия вычитается из выводимой суммы)
        planCode: { type: string }
        planVersion: { type: integer }

    # ------------------------------------------------------------------ cardholders

    CardholderCreateRequest:
      type: object
      description: 'Все PII-поля обязательны; PII не логируется. На read-путях наружу возвращаются только email и displayName, остальные PII-поля — нет.'
      required: [externalRef, providerCode, firstName, lastName, email, phone, dateOfBirth, country, address, city, state, zipCode]
      properties:
        externalRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]{1,128}$'
          description: Ваш стабильный идентификатор пользователя; уникален в пределах аккаунта, неизменяем
        providerCode:
          type: string
          pattern: '^core-\d+$'
          description: Код программы в формате core-{id} (например, core-1). Список доступных значений выдаётся вместе с ключом
        firstName: { type: string, minLength: 1, maxLength: 64 }
        lastName: { type: string, minLength: 1, maxLength: 64 }
        email:
          type: string
          format: email
          maxLength: 254
          description: На этот адрес доставляются 3DS/OTP-коды (при threeDsOtpRelay=email)
        phone:
          type: string
          pattern: '^\+[0-9]{8,15}$'
          description: Формат E.164
        dateOfBirth:
          type: string
          format: date
          description: Формат YYYY-MM-DD; возраст должен быть ≥ 18 лет
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Код страны в формате ISO-3166-1 alpha-2
        address: { type: string, minLength: 1, maxLength: 128 }
        city: { type: string, minLength: 1, maxLength: 64 }
        state:
          type: string
          minLength: 1
          maxLength: 64
          description: Для стран без регионов повторите название города
        zipCode: { type: string, minLength: 1, maxLength: 16 }
      additionalProperties: false

    Cardholder:
      type: object
      required: [cardholderId, externalRef, providerCode, status, kycStatus, displayName, email, createdAt]
      properties:
        cardholderId: { type: string }
        externalRef: { type: string }
        providerCode:
          type: string
          example: core-1
          description: >-
            Код программы, под которой создан держатель, в формате core-{id}. Возможен сентинел
            `core-unknown` (программа не сопоставлена с публичным id) — предусмотрите ветку по умолчанию.
        status:
          $ref: '#/components/schemas/CardholderStatus'
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        displayName: { type: [string, 'null'] }
        email:
          type: string
          format: email
          description: Email держателя (как указан при регистрации; возвращается только владельцу аккаунта)
        createdAt: { type: string, format: date-time }

    CardholderUpdateRequest:
      type: object
      description: Минимум одно поле; изменяемы только email и displayName
      minProperties: 1
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 128 }
      additionalProperties: false

    # ------------------------------------------------------------------ cards

    CardIssueRequest:
      type: object
      required: [cardholderId, productCode, initialAmountMinor, providerCode]
      properties:
        cardholderId: { type: string }
        providerCode:
          type: string
          pattern: '^core-\d+$'
          description: Код программы в формате core-{id}, по которой выпускается карта (например, core-1)
        productCode:
          type: string
          description: Код продукта из GET /cards/products; значения по умолчанию нет
        initialAmountMinor:
          type: integer
          format: int64
          minimum: 1
          description: В пределах [limits.minIssueAmountMinor, limits.maxFundMinor]; в minor-единицах валюты карты. Превышение maxFundMinor → 422 amount.exceeds_maximum ДО создания ордера
        currency:
          type: string
          default: USD
          description: Должна входить в capabilities.cardCurrencies
        nameOnCard:
          type: string
          minLength: 2
          maxLength: 26
          pattern: '^[A-Z0-9 .-]{2,26}$'
          description: Эмбоссинг заглавными ASCII-символами; по умолчанию — имя держателя
        externalReference:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
          description: >-
            Ваша ссылка на операцию — произвольная метка для сверки на вашей стороне.
            Возвращается в объекте ордера (ответ операции, GET /orders/{orderId}) и в
            событиях вебхуков. ВНИМАНИЕ: сервер НЕ энфорсит уникальность и НЕ дедупит
            по ней — за идемпотентность отвечает исключительно заголовок
            `Idempotency-Key`. Повтор одной и той же ссылки создаст ОТДЕЛЬНЫЕ операции.
      additionalProperties: false

    Card:
      type: object
      description: Поля last4, maskedNumber, expMonth, expYear равны null при status=issuing (дозаполняются асинхронно)
      required: [cardId, cardholderId, status, scheme, maskedNumber, last4, expMonth, expYear, currency, scale, nameOnCard, planCode, externalReference, issuedAt, closedAt]
      properties:
        cardId: { type: string }
        cardholderId: { type: string }
        status:
          $ref: '#/components/schemas/CardStatus'
        productCode:
          type: string
          nullable: true
          description: В текущем релизе всегда null (не зеркалится локально)
        scheme:
          type: string
          description: 'Открытый набор из capabilities.cardSchemes (visa, mastercard, …) — не трактуйте как строгий enum'
        maskedNumber:
          type: [string, 'null']
          description: "Маска БЕЗ BIN: '···· ···· ···· ' + last4; null пока status=issuing"
        last4:
          type: [string, 'null']
        expMonth:
          type: [integer, 'null']
        expYear:
          type: [integer, 'null']
        currency: { type: string }
        scale: { type: integer }
        nameOnCard:
          type: [string, 'null']
          description: В текущем релизе всегда null (не зеркалится локально)
        planCode:
          type: [string, 'null']
          description: Действующий тарифный план (сетку смотрите в GET /cards/{cardId}/tariff)
        externalReference:
          type: [string, 'null']
          description: В текущем релизе всегда null (не зеркалится локально)
        balance:
          oneOf:
            - $ref: '#/components/schemas/CardBalance'
            - type: 'null'
          description: >-
            Заполняется по мере возможности в GET /cards (значение кэшируется около 20 секунд;
            null для терминальных карт или при ошибке загрузки). В GET /cards/{cardId} остаётся
            null — актуальное значение получайте через GET /cards/{cardId}/balance.
        issuedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time

    CardBalance:
      type: object
      required: [cardId, availableMinor, pendingMinor, totalMinor, negative, syncedAt]
      properties:
        cardId: { type: string }
        currency: { type: string }
        scale: { type: integer }
        availableMinor:
          type: integer
          format: int64
          description: total минус активные авторизационные холды; клампится в ≥ 0 (ниже нуля не опускается)
        pendingMinor:
          type: integer
          format: int64
          description: Сумма активных холдов
        totalMinor:
          type: integer
          format: int64
          description: Забронированный (забукированный) баланс; может быть < 0 (реальный дефицит)
        negative:
          type: boolean
          description: >-
            totalMinor < 0 — реальный дефицит (забукированный баланс ушёл в минус).
            availableMinor клампится в ≥ 0 и для этого признака НЕ используется.
        syncedAt:
          type: [string, 'null']
          format: date-time
          description: Момент последней сверки баланса; null — данных ещё нет

    FundRequest:
      type: object
      required: [amountMinor]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Сумма нетто на карту; в пределах [limits.minFundMinor, limits.maxFundMinor] — пополнение гейтится maxFundMinor, а НЕ maxOperationMinor
        currency:
          type: string
          enum: [USD]
          default: USD
        externalReference:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
      additionalProperties: false

    UnloadRequest:
      type: object
      required: [amountMinor]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Сумма брутто с карты; комиссия вычитается из выводимой суммы; ≥ limits.minUnloadMinor
        currency:
          type: string
          enum: [USD]
          default: USD
        externalReference:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
      additionalProperties: false

    SecureCardData:
      type: object
      description: 'Режим D2 — реквизиты карты. Данные существуют только в моменте: не логируйте и не сохраняйте их на своей стороне'
      required: [cardId]
      properties:
        cardId: { type: string }
        pan: { type: string }
        cvv: { type: string }
        expMonth: { type: integer }
        expYear: { type: integer }

    RevealToken:
      type: object
      description: Режим D1 — одноразовая сессия hosted-iframe; PAN и CVV в этом объекте не передаются
      required: [cardId, sessionId, iframeUrl, expiresIn]
      properties:
        cardId: { type: string }
        sessionId: { type: string }
        iframeUrl:
          type: string
          format: uri
          description: URL защищённого источника для встраивания в iframe; одноразовый
        expiresIn:
          type: integer
          description: Время жизни сессии в секундах (90)

    CardTransaction:
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          required: [id, type, status, feeMinor, merchantName, mcc, mccDescription, merchantCountry, declineCode, feeType, authorizationCode, relatedAuthorizationCode, occurredAt]
          properties:
            id: { type: string }
            type:
              $ref: '#/components/schemas/CardTransactionType'
            status:
              $ref: '#/components/schemas/CardTransactionStatus'
            feeMinor:
              type: integer
              format: int64
              description: >-
                Итоговая комиссия по строке ОДНИМ числом (все составляющие уже учтены); 0 — комиссия не взимается.
                На строке type=fee сама строка и есть комиссия: amountMinor — составляющая feeMinor,
                складывать их нельзя. Баланс карты по строкам истории НЕ выводится (не каждая строка двигает
                баланс, часть движений сюда не попадает) — источник истины ровно один: GET /cards/{cardId}/balance.
            merchantName:
              type: [string, 'null']
              description: Отображаемый текст из внешнего источника, не доверенный — экранируйте при выводе и не используйте для ветвления логики
            mcc:
              type: [string, 'null']
            mccDescription:
              type: [string, 'null']
              description: Отображаемый текст, не доверенный — экранируйте при выводе
            merchantCountry:
              type: [string, 'null']
            declineCode:
              oneOf:
                - $ref: '#/components/schemas/DeclineCode'
                - type: 'null'
              description: Закрытый набор причин деклайна (при status=declined); сопоставление сырых причин выполняется на нашей стороне, значение по умолчанию — other
            feeType:
              oneOf:
                - $ref: '#/components/schemas/FeeType'
                - type: 'null'
              description: Закрытый набор типов комиссии (при type=fee)
            occurredAt:
              type: [string, 'null']
              format: date-time
              description: 'null — момент операции не передан источником'
            authorizationCode:
              type: [string, 'null']
              description: Код авторизации покупки; ключ для связи с комиссией/деклайном. null для несвязанных строк
            relatedAuthorizationCode:
              type: [string, 'null']
              description: >-
                authorizationCode родительской покупки (у строк fee/declined) — группируйте по
                совпадению с authorizationCode покупки. null для несвязанных строк

    EventCardTransaction:
      description: 'Payload транзакционных вебхуков card.transaction.* — нормативная CardTransaction ∪ контекст карты/держателя.'
      allOf:
        - $ref: '#/components/schemas/CardTransaction'
        - type: object
          required: [cardId, cardholderId, informational, occurredAt]
          properties:
            cardId:
              type: string
              description: Публичный UUID карты
            cardholderId:
              type: [string, 'null']
              description: Публичный UUID держателя (null, если не резолвится)
            informational:
              type: boolean
              const: true
              description: Событие информационное — денежный эффект уже отражён на балансе карты, дублировать проводку не нужно

    Product:
      type: object
      required: [code, name, scheme, currency, maxCardsPerCardholder]
      properties:
        code:
          type: string
          description: Стабильный код продукта; передаётся в POST /cards
        name: { type: string }
        scheme:
          type: string
          description: 'Значение из открытого набора capabilities.cardSchemes'
        currency: { type: string }
        maxCardsPerCardholder:
          type: [integer, 'null']
          description: Лимит числа карт на держателя в рамках продукта (null = применяется общий лимит из capabilities)
        providerSettings:
          type: array
          description: >-
            Read-only настройки продукта (фиксированный шаблон: 3DS, TTL, шаблон лимитов, схема
            и т.п.). Набор ключей может различаться. Значения не редактируются и не
            передаются при выпуске — шаблон применяется автоматически. Поле может
            расширяться новыми ключами.


            ПРИМЕНЕНИЕ ДЛЯ POST /products: это единственный машинный источник, по которому
            можно ДО создания продукта узнать, доступны ли для схемы Apple/Google Pay.
            Возьмите базовый продукт нужной схемы и проверьте наличие ключа `apple_pay`
            (или `google_pay`) со значением `true` — только тогда одноимённую функцию
            (`hasApplePay` / `hasGooglePay`) можно включить в POST /products; иначе запрос
            будет отклонён с 422. На текущей программе эти ключи `true` у MASTERCARD и
            `false`/отсутствуют у VISA.
          items:
            type: object
            required: [key, type, value]
            properties:
              key:
                type: string
                description: 'Канонический ключ настройки (например three_ds, apple_pay, google_pay, card_ttl_months, spending_limit, spending_period)'
              type:
                type: string
                description: 'Тип значения для отображения: bool | number | text | enum'
              value:
                type: [boolean, integer, string, 'null']

    ProductFeatures:
      type: object
      description: >-
        Набор возможностей продукта. Поле hasJIT принимается, но сервером
        игнорируется (всегда false). Доступность hasApplePay/hasGooglePay
        зависит от платёжной схемы — см. описания полей и POST /products.
      additionalProperties: false
      properties:
        has3DS: { type: boolean }
        hasApplePay:
          type: boolean
          description: >-
            Apple Pay. ЗАВИСИТ ОТ СХЕМЫ: включить можно, только если базовый
            продукт выбранной схемы в GET /cards/products имеет
            providerSettings[].key = apple_pay со значением true. На текущей
            программе доступно только для MASTERCARD; при scheme=VISA →
            422 request.validation_failed, message "Apple Pay is not available for VISA".
        hasGooglePay:
          type: boolean
          description: >-
            Google Pay. ЗАВИСИТ ОТ СХЕМЫ так же, как hasApplePay
            (providerSettings[].key = google_pay). На текущей программе доступно
            только для MASTERCARD; при scheme=VISA → 422 с message
            "Google Pay is not available for VISA".
        hasJIT:
          type: boolean
          description: 'Принимается, но игнорируется: сервер всегда форсит false (авторизация с мастер-баланса не допускается).'
        hasSpendControl: { type: boolean }
        hasMccControl: { type: boolean }
    ProductControls:
      type: object
      description: >-
        Ограничения продукта. ВНИМАНИЕ (асимметрия строгости): неизвестные ключи ВНУТРИ
        controls сервером молча ИГНОРИРУЮТСЯ — 422 не возвращается. Строгая проверка
        неизвестных полей действует только на верхнем уровне тела и внутри features.
        Опечатка в имени контрола не даст ошибки — контрол просто не применится.
      additionalProperties: true
      properties:
        isReloadable: { type: boolean, description: 'Взаимоисключающе с isOneTimeUse' }
        isOneTimeUse: { type: boolean }
        cardTTLMonths: { type: [integer, 'null'], description: 'Срок жизни карты в месяцах (1..120)' }
        maxCardsPerCardholder: { type: [integer, 'null'] }
        spendingLimit: { type: number, description: 'Лимит расходов (0..1000000)' }
        spendingPeriod:
          type: string
          enum: [TRANSAMOUNT, DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY, LIFETIME]
    ClientProduct:
      type: object
      description: >-
        Клиент-продукт в том виде, в каком он приходит в элементах GET /products.
        ВНИМАНИЕ: поля providerCode здесь НЕТ — оно возвращается только в ответе
        POST /products (см. ClientProductCreated).
      required: [code, name, scheme, currency]
      properties:
        code: { type: string, example: premium-usd-6568124d, description: 'Стабильный код клиент-продукта; передаётся в POST /cards. Генерируется СЕРВЕРОМ (слаг от name + детерминированный суффикс от Idempotency-Key) — в теле POST /products не принимается.' }
        name: { type: string }
        scheme: { type: string, example: visa, description: 'Платёжная схема в НИЖНЕМ регистре (visa | mastercard) — в отличие от поля scheme в теле POST /products, где ожидается ВЕРХНИЙ (VISA | MASTERCARD). Сравнивайте регистронезависимо.' }
        cardType: { type: [string, 'null'], description: 'CONSUMER | CORPORATE' }
        currency: { type: string }
        maxCardsPerCardholder: { type: [integer, 'null'] }
        features: { $ref: '#/components/schemas/ProductFeatures' }
        controls: { $ref: '#/components/schemas/ProductControls' }
    ClientProductCreated:
      description: >-
        Ответ POST /products — то же, что ClientProduct, ПЛЮС providerCode.
        Асимметрия намеренная: в списке GET /products поле providerCode не возвращается.
      allOf:
        - $ref: '#/components/schemas/ClientProduct'
        - type: object
          required: [providerCode]
          properties:
            providerCode: { type: string, example: core-1, description: 'Код программы (алиас core-{id}), под которой создан продукт. Возвращается ТОЛЬКО в ответе создания.' }
    ClientProductCreate:
      type: object
      required: [name, scheme]
      additionalProperties: false
      description: >-
        Тело строгое: любое поле вне этого списка → 422 request.validation_failed
        (имя поля в error.fields). Поле code не принимается — код генерирует сервер.
      properties:
        name: { type: string, maxLength: 64 }
        providerCode: { type: string, example: core-1, description: 'Код программы в формате core-{id}. Необязательный; по умолчанию — единственная настроенная программа. Неизвестный код → 422 request.validation_failed с error.fields.providerCode' }
        scheme: { type: string, enum: [VISA, MASTERCARD] }
        cardType: { type: string, enum: [CONSUMER, CORPORATE], default: CONSUMER }
        features: { $ref: '#/components/schemas/ProductFeatures' }
        controls: { $ref: '#/components/schemas/ProductControls' }
        maxCardsPerCardholder:
          type: integer
          description: 'Применяемый лимит числа карт на держателя; если задан, перекрывает controls.maxCardsPerCardholder'

    LifecyclePending:
      type: object
      description: |
        Результат lifecycle-операции (freeze/unfreeze/close), не подтверждённой
        синхронно в пределах таймаута. Операция продолжает выполняться; итоговый статус придёт
        событием card.frozen / card.unfrozen / card.closed либо доступен через GET /cards/{cardId}.
      required: [status, message]
      properties:
        status:
          type: string
          enum: [pending]
        message: { type: string }

    CardLifecycleResult:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          description: Полный объект Card с дополнительными метками времени lifecycle-операции.
          properties:
            frozenAt: { type: string, format: date-time }
            unfrozenAt: { type: string, format: date-time }

    CardCloseResult:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          description: Полный объект Card (status=closed) с дополнительными полями остатка.
          required: [closedAt, residualMinor, currency, scale]
          properties:
            closedAt: { type: string, format: date-time }
            residualMinor:
              type: integer
              format: int64
            currency: { type: string }
            scale: { type: integer }

    CardCloseAccepted:
      type: object
      description: |
        Ответ 202 на DELETE /cards/{id} при ненулевом остатке на карте. Значение status=closing
        используется только в этом ответе: оно не входит в CardStatus, и в ответах GET /cards* карта
        остаётся в фактическом статусе до перехода в closed. Остаток будет зачислен и придёт событием
        card.unloaded с этим orderId.
      required: [cardId, status, orderId, type]
      properties:
        cardId: { type: string }
        status:
          type: string
          const: closing
        orderId: { type: string }
        type:
          type: string
          const: unload

    # ------------------------------------------------------------------ orders

    OrderAccepted:
      type: object
      description: Тело ответа 202 Accepted для денежных операций
      required: [orderId, type, status]
      properties:
        orderId: { type: string }
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          type: string
          const: processing

    Order:
      type: object
      required: [orderId, type, status, cardId, cardholderId, amountMinor, feeMinor, unloadedMinor, creditedMinor, currency, scale, externalReference, failureCode, createdAt, completedAt]
      properties:
        orderId: { type: string }
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        cardId:
          type: [string, 'null']
          description: null для issue до момента создания карты
        cardholderId:
          type: [string, 'null']
        amountMinor:
          type: integer
          format: int64
          description: Запрошенная сумма (нетто для issue/fund; брутто для unload)
        feeMinor:
          type: integer
          format: int64
          description: Наша комиссия (для терминального статуса — фактическая)
        unloadedMinor:
          type: [integer, 'null']
          format: int64
          description: Только для type=unload; в терминальном статусе — фактически снятая с карты сумма
        creditedMinor:
          type: [integer, 'null']
          format: int64
          description: Только для type=unload; в терминальном статусе — зачислено на кошелёк
        currency: { type: string }
        scale: { type: integer }
        externalReference:
          type: [string, 'null']
        failureCode:
          oneOf:
            - $ref: '#/components/schemas/FailureCode'
            - type: 'null'
          description: Заполняется при status=failed/refunded
        createdAt: { type: string, format: date-time }
        completedAt:
          type: [string, 'null']
          format: date-time

    # ------------------------------------------------------------------ webhooks

    WebhookConfig:
      type: object
      required: [id, url, status, events, signatureMode, secretFingerprint, consecutiveFailures, lastSuccessAt, lastFailureAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: >-
            Публичный идентификатор endpoint (используется в `DELETE /webhooks/{webhookId}`).
            У аккаунта активен РОВНО ОДИН endpoint: `PUT /webhooks` с другим `url` создаёт новый
            и автоматически переводит прежний в `status=disabled` (`disabled_reason=replaced`) —
            веерная доставка на несколько URL не поддерживается.
        url: { type: string, format: uri }
        status:
          type: string
          enum: [active, disabled]
          description: disabled = endpoint выключен автоматически после серии неудачных доставок или вручную; события в этот период получают status=skipped
        events:
          type: array
          items: { type: string }
          description: Точные типы событий и/или glob-шаблоны (card.*, *); glob-шаблоны сопоставляются только с опубликованным каталогом событий; * не включает чувствительные категории
        signatureMode:
          type: string
          enum: [caas_v1, data_sign_compat]
          description: 'data_sign_compat — режим совместимости для миграции (в тело добавляется поле sign; метки времени в теле нет ни в одном режиме); заголовок X-Caas-Signature присутствует всегда'
        secretFingerprint:
          type: string
          pattern: '^[0-9a-f]{8}$'
          description: Короткий префикс отпечатка подписывающего секрета (первые 8 hex-символов) — только для визуальной идентификации; это не полный отпечаток и он не пригоден для проверки подписи
        consecutiveFailures: { type: integer }
        lastSuccessAt:
          type: [string, 'null']
          format: date-time
        lastFailureAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookUpsertRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: Только https на порту :443; хост должен быть публично доступен
        events:
          type: array
          minItems: 1
          items: { type: string }
        signatureMode:
          type: string
          enum: [caas_v1, data_sign_compat]
          default: caas_v1
      additionalProperties: true
      description: 'Неизвестные поля тела игнорируются (tolerant reader), ошибкой не являются.'

    WebhookSecretRotation:
      type: object
      required: [secret, rotatedAt, oldSecretValidUntil]
      properties:
        secret:
          type: string
          pattern: '^whsec_[0-9a-f]{64}$'
        rotatedAt: { type: string, format: date-time }
        oldSecretValidUntil:
          type: string
          format: date-time
          description: Окно совместимости 24 ч — до этого момента прежний секрет также действителен для проверки подписи

    WebhookDelivery:
      type: object
      required: [deliveryId, event, status, attempts, lastHttpCode, lastError, nextRetryAt, deliveredAt, createdAt]
      properties:
        deliveryId:
          type: string
          description: Совпадает с eventId конверта доставки
        event: { type: string }
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts: { type: integer }
        lastHttpCode:
          type: [integer, 'null']
        lastError:
          type: [string, 'null']
          description: Класс ошибки (timeout, dns, 5xx, redirect_blocked, ssrf_blocked, …)
        nextRetryAt:
          type: [string, 'null']
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }

    # ------------------------------------------------------------- события (data)

    WebhookEnvelope:
      type: object
      description: |
        Конверт исходящего вебхука (режим caas_v1). Тело не содержит метки времени и подписи:
        метка времени и подпись передаются в подписанном заголовке X-Caas-Signature (t=<unix>).
        В опциональном режиме data_sign_compat в тело дополнительно добавляется поле
        sign = HMAC_SHA256(секрет, сырые байты поля data). Поле eventId используйте как ключ
        дедупликации на своей стороне.
      required: [event, version, eventId, data]
      properties:
        event:
          type: string
          description: Тип из каталога событий
        version:
          type: string
          description: Версия схемы события; эволюционирует независимо от версии API, с анонсом
          examples: ['1.0']
        eventId:
          type: string
          description: Уникальный id доставки — ключ дедупа
        data:
          type: object

    EventCardCreated:
      type: object
      description: Событие card.created
      required: [cardId, cardholderId, orderId, status, productCode, scheme, last4, expMonth, expYear, initialAmountMinor, feeMinor, currency, scale, externalReference, occurredAt]
      properties:
        cardId: { type: string }
        cardholderId: { type: string }
        orderId:
          type: [string, 'null']
          description: null только для карт, созданных вне вашего API-потока
        status:
          $ref: '#/components/schemas/CardStatus'
        productCode: { type: string }
        scheme:
          type: [string, 'null']
          description: 'Значение из открытого набора capabilities.cardSchemes (visa, mastercard, …); null до завершения провижининга'
        last4:
          type: [string, 'null']
        expMonth:
          type: [integer, 'null']
        expYear:
          type: [integer, 'null']
        initialAmountMinor:
          type: integer
          format: int64
        feeMinor:
          type: integer
          format: int64
          description: Комиссия за выпуск; совпадает с суммой из issue-quote
        currency: { type: string }
        scale: { type: integer }
        externalReference:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardFailed:
      type: object
      description: Событие card.failed — карта не создана, поле cardId отсутствует
      required: [orderId, cardholderId, failureCode, amountMinor, currency, scale, refunded, externalReference, occurredAt]
      properties:
        orderId: { type: string }
        cardholderId:
          type: [string, 'null']
        failureCode:
          $ref: '#/components/schemas/FailureCode'
        amountMinor:
          type: integer
          format: int64
        currency: { type: string }
        scale: { type: integer }
        refunded:
          type: boolean
          const: true
          description: Средства уже возвращены на кошелёк — повторная компенсация не требуется
        externalReference:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardFunded:
      type: object
      required: [cardId, orderId, amountMinor, feeMinor, totalChargedMinor, currency, scale, externalReference, occurredAt]
      properties:
        cardId: { type: string }
        orderId:
          type: [string, 'null']
        amountMinor:
          type: integer
          format: int64
          description: Нетто-сумма, зачисленная на карту
        feeMinor:
          type: integer
          format: int64
        totalChargedMinor:
          type: integer
          format: int64
          description: Списано с кошелька (amount + fee)
        currency: { type: string }
        scale: { type: integer }
        externalReference:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardOtp:
      type: object
      description: >-
        События card.3ds_otp / card.tokenization_otp — одноразовый код держателю. SENSITIVE: поле `code`
        передаётся только при threeDsOtpRelay=webhook, живёт ограниченное время (~5 мин). Доставить держателю
        немедленно; не логировать и не хранить дольше необходимого.
      required: [cardId, type, code, occurredAt]
      properties:
        cardId: { type: string, description: Идентификатор карты (cardId) }
        type:
          type: string
          enum: [3ds, tokenization]
        code:
          type: string
          description: Одноразовый OTP-код (sensitive)
        last4:
          type: [string, 'null']
          description: Последние 4 цифры карты (для UX)
        context:
          type: object
          additionalProperties: true
          description: 'Не-sensitive контекст операции (amount/currency/merchant), без PAN; ключи best-effort'
        informational:
          type: boolean
        occurredAt: { type: string, format: date-time }

    EventCardMoneyFailed:
      type: object
      description: 'Событие card.unloading_failed: движения средств не было, возвращать нечего'
      required: [cardId, orderId, failureCode, amountMinor, currency, scale, externalReference, occurredAt]
      properties:
        cardId: { type: string }
        orderId:
          type: [string, 'null']
        failureCode:
          $ref: '#/components/schemas/FailureCode'
        amountMinor:
          type: integer
          format: int64
        currency: { type: string }
        scale: { type: integer }
        externalReference:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardFundingFailed:
      allOf:
        - $ref: '#/components/schemas/EventCardMoneyFailed'
        - type: object
          description: 'Событие card.funding_failed: средства возвращены на кошелёк'
          required: [refunded]
          properties:
            refunded:
              type: boolean
              const: true
              description: Средства (amount + fee) уже возвращены на кошелёк

    EventCardUnloaded:
      type: object
      description: 'Событие card.unloaded; имена денежных полей совпадают с полями ордера в GET /orders/{id}'
      required: [cardId, orderId, unloadedMinor, feeMinor, creditedMinor, currency, scale, externalReference, occurredAt]
      properties:
        cardId: { type: string }
        orderId:
          type: [string, 'null']
          description: Ордер unload либо unload-ордер зачисления остатка при закрытии карты
        unloadedMinor:
          type: integer
          format: int64
          description: Брутто-сумма, снятая с карты (при частичном снятии может быть меньше запрошенной; комиссия пересчитывается pro-rata)
        feeMinor:
          type: integer
          format: int64
        creditedMinor:
          type: integer
          format: int64
          description: Зачислено на кошелёк (unloaded − fee)
        currency: { type: string }
        scale: { type: integer }
        externalReference:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardExpired:
      type: object
      description: Событие card.expired — остаток не зачисляется автоматически
      required: [cardId, status, previousStatus, expMonth, expYear, residualAmountMinor, currency, scale, occurredAt]
      properties:
        cardId: { type: string }
        status:
          type: string
          const: expired
        previousStatus:
          oneOf:
            - $ref: '#/components/schemas/CardStatus'
            - type: 'null'
        expMonth: { type: integer }
        expYear: { type: integer }
        residualAmountMinor:
          type: integer
          format: int64
          description: Остаток на карте (автоматически не зачисляется, требуется ручной разбор); 0 при отрицательном балансе карты
        currency: { type: string }
        scale: { type: integer }
        occurredAt: { type: string, format: date-time }

    EventCardStatus:
      type: object
      description: Общая схема событий card.frozen / card.unfrozen / card.suspended
      required: [cardId, status, occurredAt]
      properties:
        cardId: { type: string }
        status:
          $ref: '#/components/schemas/CardStatus'
        reason:
          type: [string, 'null']
          description: Закрытый enum причин, свой для каждого события; null = причина не классифицирована
        occurredAt: { type: string, format: date-time }

    EventCardClosed:
      type: object
      description: Событие card.closed
      required: [cardId, status, residualAmountMinor, residualCreditedMinor, currency, scale, closedAt, occurredAt]
      properties:
        cardId: { type: string }
        status:
          type: string
          const: closed
        reason:
          type: [string, 'null']
          description: client_request | cardholder_closed | risk_control | other | null
        residualAmountMinor:
          type: integer
          format: int64
          description: '> 0 ⇒ остаток зачислен этим событием (закрытие вне API); 0 при закрытии через API (остаток пришёл отдельным событием card.unloaded) и при отрицательном балансе карты'
        residualCreditedMinor:
          type: integer
          format: int64
          description: Всегда равно residualAmountMinor (комиссия с остатка не взимается)
        currency: { type: string }
        scale: { type: integer }
        closedAt: { type: string, format: date-time }
        occurredAt: { type: string, format: date-time }

    EventCardTariffPlanAssigned:
      type: object
      required: [cardId, planCode, planVersion, previousPlanCode, occurredAt]
      properties:
        cardId: { type: string }
        planCode: { type: string }
        planVersion: { type: integer }
        previousPlanCode:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventCardholderCreated:
      type: object
      required: [cardholderId, externalRef, status, kycStatus, occurredAt]
      properties:
        cardholderId: { type: string }
        externalRef: { type: string }
        status:
          $ref: '#/components/schemas/CardholderStatus'
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        occurredAt: { type: string, format: date-time }

    EventCardholderStatusChanged:
      type: object
      required: [cardholderId, status, occurredAt]
      properties:
        cardholderId: { type: string }
        status:
          $ref: '#/components/schemas/CardholderStatus'
        occurredAt: { type: string, format: date-time }

    EventCardholderKyc:
      type: object
      description: 'Общая схема событий cardholder.kyc_approved / cardholder.kyc_rejected'
      required: [cardholderId, kycStatus, reason, occurredAt]
      properties:
        cardholderId: { type: string }
        kycStatus:
          type: string
          enum: [accepted, waived, rejected]
          description: accepted|waived — для kyc_approved; rejected — для kyc_rejected
        reason:
          type: [string, 'null']
          description: Только для kyc_rejected — нормализованная причина из нашего каталога (только для отображения); для kyc_approved всегда null
        occurredAt: { type: string, format: date-time }

    EventCardholderTariffPlanAssigned:
      type: object
      description: Событие cardholder.tariff_plan_assigned
      required: [cardholderId, planCode, planVersion, previousPlanCode, occurredAt]
      properties:
        cardholderId: { type: string }
        planCode: { type: string }
        planVersion: { type: integer }
        previousPlanCode:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    EventAccountDepositCredited:
      type: object
      description: 'Событие account.deposit_credited — отправляется после фактического зачисления средств на счёт тенанта; идемпотентно по networkTxId (при повторной доставке обрабатывайте один раз). on-chain поля (network/address/networkTxId) заполнены для крипто-депозита; для внутреннего зачисления они null.'
      required: [amountMinor, currency, scale, network, address, networkTxId, balanceAfterMinor, occurredAt]
      properties:
        amountMinor:
          type: integer
          format: int64
        currency: { type: string }
        scale: { type: integer }
        network:
          type: [string, 'null']
          description: Значение из capabilities.walletNetworks; null для внутреннего зачисления
        address: { type: [string, 'null'] }
        networkTxId:
          type: [string, 'null']
          description: Идентификатор транзакции в блокчейне — ключ сверки с фактом on-chain; null для внутреннего зачисления
        balanceAfterMinor:
          type: integer
          format: int64
        occurredAt: { type: string, format: date-time }

    EventWebhookTest:
      type: object
      required: [test, message, occurredAt]
      properties:
        test:
          type: boolean
          const: true
        message:
          type: string
          description: Фиксированная строка
        occurredAt: { type: string, format: date-time }
