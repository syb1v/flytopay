      summary: 3DS-OTP код (подтверждение оплаты)
      description: >-
        Отправляется, когда по карте инициирована 3-D Secure аутентификация и сгенерирован
        одноразовый код. Приходит только при `threeDsOtpRelay=webhook`. Тенант обязан немедленно доставить
        `data.code` держателю (SMS/email/push). SENSITIVE: код живёт ограниченное время (~5 мин); не логировать,
        не хранить дольше необходимого.
      parameters:
        - $ref: '#/components/parameters/WhSignature'
        - $ref: '#/components/parameters/WhEvent'
        - $ref: '#/components/parameters/WhEventId'
        - $ref: '#/components/parameters/WhDelivery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { const: card.3ds_otp }
                    data:
                      $ref: '#/components/schemas/EventCardOtp'
            example:
              event: card.3ds_otp
              version: '1.0'
              eventId: e3f4a5b6-c7d8-4e9f-8a1b-3c4d5e6f70a1
              data:
                cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                type: 3ds
                code: '654321'
                last4: '4242'
                context: { amount: 12.5, currency: USD, merchant: 'STARBUCKS #1234' }
                informational: true
                occurredAt: '2026-07-11T15:43:03Z'
      responses:
        '200': { description: Любой 2xx = принято }

  card.tokenization_otp:
