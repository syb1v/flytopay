        Закрытие через API: остаток приходит отдельным событием card.unloaded
        (с orderId закрытия, feeMinor=0), а здесь residualAmountMinor=0.
        Закрытие вне API: остаток приходит ТОЛЬКО в этом событии
        (residualAmountMinor>0, residualCreditedMinor = residualAmountMinor —
        комиссия с остатка не взимается). Движение средств отражается в
        GET /account/transactions. Отдельного события card.terminated не существует.
      parameters:
        - $ref: '#/components/parameters/WhSignature'
        - $ref: '#/components/parameters/WhEvent'
        - $ref: '#/components/parameters/WhEventId'
        - $ref: '#/components/parameters/WhDelivery'
