openapi: 3.1.0

# =============================================================================
# Cards API — публичный контракт для выпуска и обслуживания виртуальных карт.
# =============================================================================

info:
  title: CaaS Cards API
  version: 1.0.0
  summary: API выпуска и обслуживания виртуальных карт
  contact:
    name: CaaS Integration Support

servers:
  - url: https://api.2328.io/caas/v1

security:
  - apiKey: []

tags:
  - name: System
    description: Служебные эндпоинты (liveness-проба доступности API)
  - name: Account
    description: Данные аккаунта и доступные возможности, баланс кошелька, пополнение
  - name: Tariffs
    description: Тарифные планы, расчёт стоимости (quote) и назначение плана карте
  - name: Cardholders
    description: Держатели карт. Персональные данные передаются один раз при создании и в ответах не возвращаются
  - name: Cards
    description: Выпуск и обслуживание карт. Денежные операции асинхронны — ответ 202 Accepted с orderId, итог в GET /orders/{orderId}
  - name: Products
    description: Каталог доступных типов карт
  - name: Orders
    description: Проверка исхода асинхронных денежных операций по orderId
  - name: Webhooks
    description: Настройка исходящих вебхуков и журнал их доставок

paths:

  # ===========================================================================
  # System
  # ===========================================================================

  /ping:
    get:
      operationId: ping
      tags: [System]
      summary: Проверка доступности API (liveness)
      description: >-
        Публичный liveness-эндпоинт: не требует аутентификации и не обращается к
        внешним сервисам. Возвращает 200, пока API принимает запросы. Предназначен
        для health-проб/мониторинга, а не для проверки валидности API-ключа.
        Эндпоинт подпадает под общий per-IP rate-limit публичной поверхности —
        при частом опросе возможен 429.
      security: []
      responses:
        '200':
          description: API доступен
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, api]
                        properties:
                          status: { type: string, example: ok }
                          api: { type: string, example: v1 }
              example:
                success: true
                status: 200
                message: OK
                data:
                  status: ok
                  api: v1
                meta:
                  requestId: 2c314c82-2994-4cae-9fd4-312635650fa7
                  timestamp: '2026-07-10T01:41:41Z'
        '429': { $ref: '#/components/responses/RateLimited' }

  # ===========================================================================
  # Account
  # ===========================================================================

  /account/info:
    get:
      operationId: getAccountInfo
      tags: [Account]
      summary: Параметры и лимиты аккаунта
      description: >-
        Возвращает действующие параметры аккаунта: минимальные и максимальные
        суммы операций, поддерживаемые валюты и схемы карт, квоты, rate-limits и
        доступные функции (secure-reveal, ретрансляция 3DS/OTP, режим KYC).
        Эти значения зависят от аккаунта и могут меняться — читайте их из этого
        ответа, не задавайте константами в коде клиента. Ответ можно кэшировать
        на срок не более 5 минут.


        Единственный эндпоинт, доступный при `status=suspended`: приостановленный
        аккаунт получает 200 с `data.status=suspended` (на остальных эндпоинтах —
        401 auth.unauthorized). Это позволяет клиенту отличить приостановку
        аккаунта от отзыва ключа.
      x-required-scope: account:read
      responses:
        '200':
          description: Capabilities аккаунта
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountInfo'
              example:
                success: true
                status: 200
                message: OK
                data:
                  accountId: 9c6f1a2e-4b1d-4c3a-8e6f-2d1c3b4a5f60
                  environment: live
                  status: active
                  capabilities:
                    cardCurrencies: [USD]
                    walletCurrencies: [USDT]
                    walletNetworks: { USDT: [TRON, BSC, ETHEREUM, POLYGON, AVALANCHE, TON] }
                    cardSchemes: [visa, mastercard]
                    limits:
                      minIssueAmountMinor: 500
                      minFundMinor: 500
                      minUnloadMinor: 500
                      maxOperationMinor: 100000000
                      maxFundMinor: 250000
                      maxCardsPerCardholder: 5
                      maxCardsPerAccount: 1000
                      dailyFundingVolumeMinor: 500000000
                      rateLimits: { readPerMin: 1200, writePerMin: 20, securePerMin: 10 }
                    features:
                      secureReveal: false
                      secureApiRaw: false
                      threeDsOtpRelay: webhook
                      tokenization: false
                      kycRequired: false
                      suspendedClearedByFund: true
                      closeCooldownHours: 24
                      physicalCards: false
                    restrictions: { blockedMcc: [], blockedCountries: [] }
                  webhooksConfigured: true
                  createdAt: '2026-06-01T00:00:00Z'
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCD, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /account/wallet:
    get:
      operationId: getAccountWallet
      tags: [Account]
      summary: Баланс кошелька аккаунта
      description: >-
        Баланс кошелька аккаунта в USDT (целые minor-единицы, поля currency и
        scale). Поле onCardsMinor — суммарный остаток на картах, выражен в валюте
        КАРТ (onCardsCurrency / onCardsScale) с иным scale, чем у кошелька;
        не складывайте его с полями кошелька без приведения к единому scale.
      x-required-scope: account:read
      responses:
        '200':
          description: Баланс кошелька
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            description: Баланс аккаунта по каждой программе (по одному элементу на программу)
                            items:
                              allOf:
                                - type: object
                                  required: [providerCode]
                                  properties:
                                    providerCode:
                                      type: string
                                      pattern: '^core-([0-9]+|unknown)$'
                                      description: >-
                                        Код программы в формате core-{id}. Значение `core-unknown` —
                                        программа временно не сопоставлена с публичным id (ошибка
                                        конфигурации на нашей стороне); трактуйте как незнакомое
                                        значение и предусмотрите ветку по умолчанию.
                                - $ref: '#/components/schemas/WalletBalance'
              example:
                success: true
                status: 200
                message: OK
                data:
                  items:
                    - providerCode: core-1
                      currency: USDT
                      scale: 6
                      availableMinor: 15432000000
                      reservedMinor: 520000000
                      totalMinor: 15952000000
                      onCardsMinor: 80000
                      onCardsCurrency: USD
                      onCardsScale: 2
                      availableUsd: '15432.00'
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCE, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /account/pricing:
    get:
      operationId: getAccountPricing
      tags: [Account, Tariffs]
      summary: Действующий прайс аккаунта (тарифная сетка по умолчанию)
      description: >-
        Тарифная сетка аккаунта по умолчанию (без привязки к конкретной карте).
        Для тарифа конкретной карты используйте GET /cards/{cardId}/tariff, для
        точного расчёта стоимости операции — GET /tariffs/quote. В сетке
        показаны только реально взимаемые статьи. Версия тарифного плана здесь
        не возвращается: пара (planCode, planVersion) фиксируется в ответе quote
        и в ордере.
      x-required-scope: account:read
      parameters:
        - name: productCode
          in: query
          required: false
          description: Тарифная сетка для конкретного типа карты (тарифы могут отличаться по продуктам)
          schema: { type: string }
        - name: currency
          in: query
          required: false
          description: Валюта тарифной сетки (3-буквенный код, по умолчанию USD; неизвестное значение игнорируется — применяется USD)
          schema: { type: string, default: USD, pattern: '^[A-Za-z]{3}$' }
      responses:
        '200':
          description: Тарифная сетка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PricingSchedule'
              example:
                success: true
                status: 200
                message: OK
                data:
                  planCode: default
                  currency: USD
                  scale: 2
                  fees:
                    - { feeItem: issuance, collection: upfront, chargedFrom: wallet, flatMinor: 500, bps: 0, minMinor: 0, period: none }
                    - { feeItem: funding, collection: upfront, chargedFrom: wallet, flatMinor: 0, bps: 250, minMinor: 0, period: none }
                    - { feeItem: unload, collection: upfront, chargedFrom: wallet, flatMinor: 0, bps: 100, minMinor: 0, period: none }
                    - { feeItem: transaction, collection: usage, chargedFrom: card, flatMinor: 20, bps: 0, minMinor: 0, period: none }
                    - { feeItem: fx, collection: usage, chargedFrom: card, flatMinor: 0, bps: 300, minMinor: 50, period: none }
                    - { feeItem: maintenance, collection: usage, chargedFrom: card, flatMinor: 200, bps: 0, minMinor: 0, period: monthly }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCF, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/PricingPlanMissing' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /account/transactions:
    get:
      operationId: listAccountTransactions
      tags: [Account]
      summary: История движений по кошельку аккаунта
      description: Денежная история кошелька аккаунта (USDT, scale 6). Это первичный источник денежных данных, в отличие от транзакций по картам.
      x-required-scope: transactions:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          required: false
          description: >-
            Фильтр по типу движения. Значение `adjustment` встречается в поле `type` ответа,
            но фильтровать по нему нельзя — запрос вернёт 422.
          schema:
            type: string
            enum: [deposit, card_funding, card_fee, card_unload, refund, program_return]
        - name: from
          in: query
          required: false
          description: Нижняя граница occurredAt (RFC 3339)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Верхняя граница occurredAt (RFC 3339)
          schema: { type: string, format: date-time }
        - name: provider
          in: query
          required: false
          description: 'Фильтр по ПРОГРАММЕ (код программы core-{id}). Опущен — все программы аккаунта. Неизвестный → 422.'
          schema: { type: string, example: core-1 }
      responses:
        '200':
          description: Страница движений (от новых к старым)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/WalletTransaction'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
              example:
                success: true
                status: 200
                message: OK
                data:
                  items:
                    - id: wtx_3f9a1c7e2b4d5a6f7c8e9d0a
                      type: card_funding
                      direction: out
                      amountMinor: 10500000
                      currency: USDT
                      scale: 6
                      balanceAfterMinor: 15421500000
                      orderId: 0b1e7c9a-0000-4000-8000-000000000002
                      cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                      occurredAt: '2026-07-01T12:00:04Z'
                    - id: wtx_9d0a8c7e6b5a4f3e2d1c0b9a
                      type: deposit
                      direction: in
                      amountMinor: 100000000
                      currency: USDT
                      scale: 6
                      balanceAfterMinor: 15432000000
                      orderId: null
                      cardId: null
                      occurredAt: '2026-07-01T09:10:11Z'
                  pagination: { limit: 20, nextCursor: null, hasMore: false }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCG, timestamp: '2026-07-01T12:34:56Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /account/deposit-address:
    post:
      operationId: createDepositAddress
      tags: [Account]
      summary: Адрес пополнения кошелька (недоступно через API)
      description: >-
        Пополнение баланса аккаунта через API-адрес не предусмотрено: баланс
        пополняется из личного кабинета, а не по on-chain адресу через API.
        Endpoint присутствует в контракте для совместимости, но всегда отвечает
        422 not_supported: тело запроса не требуется, адрес не выдаётся.
      deprecated: true
      x-required-scope: account:write
      responses:
        '422': { $ref: '#/components/responses/NotSupported' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # Tariffs
  # ===========================================================================

  /tariffs/plans:
    get:
      operationId: listTariffPlans
      tags: [Tariffs]
      summary: Каталог публичных тарифных планов
      description: >-
        Возвращает только публичные тарифные планы. Приватные планы назначаются
        платформой и в каталоге не отображаются; через API приватный план
        неотличим от несуществующего. Каталог не содержит ставок — сами ставки
        читаются из резолвнутой тарифной сетки (`/account/pricing`,
        `/cards/{cardId}/tariff`) либо через предрасчёт `/tariffs/quote`.
      x-required-scope: tariffs:read
      parameters:
        - name: currency
          in: query
          required: false
          description: Валюта карт (default USD)
          schema: { type: string, default: USD }
      responses:
        '200':
          description: Список планов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/TariffPlan'
              example:
                success: true
                status: 200
                message: OK
                data:
                  items:
                    - { code: default, name: Standard, version: 3, isDefault: true }
                    - { code: volume, name: Volume, version: 1, isDefault: false }
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCJ, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /tariffs/quote:
    get:
      operationId: getTariffQuote
      tags: [Tariffs]
      summary: Точный препросчёт комиссии до операции
      description: >-
        Предрасчёт комиссии тем же движком, которым она будет фактически списана:
        в пределах актуальной версии плана расчёт совпадает со списанием. Quote
        не резервирует цену — если между расчётом и операцией сменится версия
        плана, комиссия спишется по актуальной версии (окно смены — секунды).
        Без контекстных параметров расчёт выполняется по плану аккаунта по
        умолчанию. Суммы указываются в целых minor-единицах валюты карт (USD,
        scale 2).
      x-required-scope: tariffs:read
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            type: string
            enum: [issue, fund, unload]
        - name: amountMinor
          in: query
          required: true
          description: Сумма операции в minor-единицах, > 0 и ≤ limits.maxOperationMinor; валюта карт USD, scale 2
          schema: { type: integer, format: int64, minimum: 1 }
        - name: cardId
          in: query
          required: false
          description: Применить per-card тариф; тип карты учитывается автоматически. Чужой или несуществующий cardId → 404
          schema: { type: string, maxLength: 64 }
        - name: cardholderId
          in: query
          required: false
          description: Применить тариф держателя (для operation=issue, когда карта ещё не выпущена). Чужой или несуществующий cardholderId → 404
          schema: { type: string, maxLength: 64 }
        - name: productCode
          in: query
          required: false
          description: Применить тариф типа карты (для operation=issue без привязки к держателю)
          schema: { type: string }
      responses:
        '200':
          description: Расчёт комиссии
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TariffQuote'
              example:
                success: true
                status: 200
                message: OK
                data:
                  operation: fund
                  currency: USD
                  scale: 2
                  amountMinor: 10000
                  feeMinor: 250
                  totalChargeMinor: 10250
                  planCode: default
                  planVersion: 3
                meta: { requestId: req_01J9X2K7M3QF8YV4N0P6T1ABCK, timestamp: '2026-07-01T12:34:56Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /cards/{cardId}/tariff:
    get:
      operationId: getCardTariff
      tags: [Tariffs, Cards]
      summary: Действующая тарифная сетка карты
      description: >-
        Возвращает действующую тарифную сетку карты. Схема ответа совпадает с
        `/account/pricing`, но резолв выполняется с учётом привязок на уровне
        карты и держателя. Если тарифный план не резолвится, ответ — `503
        service.unavailable` (в отличие от `/account/pricing` и `/tariffs/quote`,
        где та же причина даёт `422 pricing.plan_missing`).
      x-required-scope: tariffs:read
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Резолвнутая сетка карты
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PricingSchedule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ===========================================================================
  # Cardholders
  # ===========================================================================

  /cardholders:
    post:
      operationId: createCardholder
      tags: [Cardholders]
      summary: Создать или вернуть держателя (идемпотентно по externalRef)
      description: >-
        Создаёт держателя карт. Все PII-поля обязательны и валидируются до
        создания. Операция идемпотентна: помимо
        заголовка Idempotency-Key повтор с тем же `externalRef` возвращает уже
        существующего держателя с кодом 200. PII сохраняется как снимок и в ответах
        не возвращается (наружу доступны только displayName и email как канал
        доставки OTP).
      x-required-scope: cardholders:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
