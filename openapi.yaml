      summary: Продукты тенанта
      description: >-
        Возвращает продукты, сконфигурированные и созданные тенантом (действуют
        только для его карт).
      x-required-scope: cards:read
      parameters:
        - name: provider
          in: query
          required: false
          description: 'Фильтр по ПРОГРАММЕ (код программы core-{id}). Опущен — программа аккаунта по умолчанию. Неизвестный → 422.'
          schema: { type: string, example: core-1 }
      responses:
        '200':
          description: >-
            Возвращаются ВСЕ активные клиент-продукты тенанта (их количество само по
            себе ограничено потолком активных продуктов). Курсорной пагинации нет —
            объект `pagination` не возвращается. ВНИМАНИЕ: элементы списка НЕ содержат
            `providerCode` — он возвращается только в ответе POST /products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ClientProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createClientProduct
      tags: [Products]
      summary: Создать продукт тенанта
      description: >-
        Создаёт продукт по конфигурации тенанта (платёжная схема, тип, набор
        функций и ограничения). Указанные ограничения применяются к картам этого
        продукта принудительно. Заголовок `Idempotency-Key` обязателен. Поле
        `hasJIT` игнорируется (всегда `false`: авторизация с мастер-баланса не
        допускается). Внимание: операция изменяет каталог продуктов в боевой
        среде.


        Тело строгое: любое неизвестное поле → `422 request.validation_failed`
        (имя поля — в `error.fields`). Поле `code` НЕ принимается: код продукта
        генерирует сервер (слаг от `name` + детерминированный суффикс от
        `Idempotency-Key`); он возвращается в ответе и используется далее в
        `POST /cards`.


        Доступность `hasApplePay` / `hasGooglePay` ЗАВИСИТ ОТ СХЕМЫ: включить их
        можно, только если базовый продукт этой схемы в каталоге
        `GET /cards/products` поддерживает соответствующую настройку
        (`providerSettings[].key` = `apple_pay` / `google_pay` со значением
        `true`). На текущей программе они доступны только для `MASTERCARD`, для
        `VISA` — недоступны. Попытка включить недоступную для схемы функцию →
        `422 request.validation_failed` с `message: "Apple Pay is not available
        for VISA"` (аналогично Google Pay). Проверяйте доступность заранее по
        `GET /cards/products`.


        Действует потолок активных продуктов тенанта (100, суммарно по всем
        схемам, не per-scheme): при достижении → `422 request.validation_failed`
        с `message: "active client-product limit reached (100)"`. Слот освобождается
        архивированием (`DELETE /products/{code}`), НО архивировать можно только
        продукт без живых карт (active/frozen/suspended) — иначе архивация будет
        отклонена. Планируйте потолок заранее: продукт с выпущенными картами
        занимает слот до тех пор, пока все его карты не закрыты.


        ВАЖНО про 422: все бизнес-отказы возвращаются с ОДНИМ кодом
        `request.validation_failed`, поэтому ветвление только по `error.code`
        здесь недостаточно. При отклонении конфигурации
        `error.fields` содержит лишь `{"configuration":
        ["request.validation_failed"]}` — это НЕ пофолейная детализация.
        Различайте причину по `error.message`: `"Apple Pay is not available for
        VISA"` — функция недоступна для схемы; `"active client-product limit
        reached (100)"` — потолок продуктов; `"Product configuration was
        rejected"` — конфигурация отклонена
        (повтор с тем же ключом не поможет: измените конфигурацию и возьмите
        НОВЫЙ `Idempotency-Key`). Пофолейные ошибки формата тела (неизвестное
        поле, неверный `providerCode`, нарушенный диапазон) приходят в
        `error.fields` как обычно.
      x-required-scope: cards:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientProductCreate' }
      responses:
        '201':
          description: Создан
          content:
