          возвращаются все реквизиты (pan, cvv, expMonth, expYear).
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: 'Реквизиты карты; пример с реальным PAN намеренно не приводится'
          content:
            application/json:
              schema:
