        `data.secret` (формат whsec_ и 64 hex-символа) — он показывается только
        один раз, сохраните его. Обновление реактивирует endpoint
        (status=active, consecutiveFailures=0). Требования к URL: только https на
        порту 443; приватные, loopback, link-local и metadata-адреса,
