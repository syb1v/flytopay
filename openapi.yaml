        - $ref: '#/components/parameters/WhSignature'
        - $ref: '#/components/parameters/WhEvent'
        - $ref: '#/components/parameters/WhEventId'
        - $ref: '#/components/parameters/WhDelivery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    event: { const: card.created }
                    data:
                      $ref: '#/components/schemas/EventCardCreated'
            example:
              event: card.created
              version: '1.0'
              eventId: c1d2e3f4-a5b6-4c8d-9e0f-1a2b3c4d5e6f
              data:
                cardId: 8f2d840e-c05d-418f-9845-9a057b1fcab5
                cardholderId: 3c1d2e3f-0000-4000-8000-000000000010
                orderId: 0b1e7c9a-0000-4000-8000-000000000002
                status: active
                productCode: vusa
                scheme: visa
                last4: '4242'
                expMonth: 12
                expYear: 2028
                initialAmountMinor: 5000
                feeMinor: 500
                currency: USD
                scale: 2
                externalReference: issue-u42-001
                occurredAt: '2026-07-01T12:00:04Z'
      responses:
        '200': { description: Любой 2xx = принято (тело не читается) }

