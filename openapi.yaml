        списанием. Комиссию клиент не передаёт — при наличии лишних полей в теле
        запрос отклоняется с `422 request.validation_failed`.


        Операция асинхронна: в ответ приходит `202 Accepted` с `orderId`. Ответ
        `202` означает лишь приём в обработку, но не исполнение. Итог отслеживайте
        по вебхукам `card.created` / `card.failed` или через
