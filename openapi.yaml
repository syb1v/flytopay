                - type: object
                  properties:
                    event: { const: card.closed }
                    data:
                      $ref: '#/components/schemas/EventCardClosed'
            example:
              event: card.closed
              version: '1.0'
              eventId: c7d8e9f0-a1b2-4c3d-8e5f-708192a3b4c5
              data:
